name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vérifie le formatage, les modules, go vet et les tests Go avec le détecteur de data races.
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  # Contrôle les dépendances si disponible puis bloque les vulnérabilités et secrets avec Trivy.
  security-source:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          timeout: 15m
          version: v0.74.0

  # Analyse statiquement le code Go avec CodeQL lorsque GitHub Code Security est disponible.
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        run: go build ./...

      - name: Analyze
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:go

      - name: Explain unavailable CodeQL
        if: github.event.repository.private && vars.CODEQL_ENABLED != 'true'
        run: echo "::notice::Enable GitHub Code Security, then set CODEQL_ENABLED=true to enforce CodeQL."

  # Compile et contrôle le binaire pour chaque combinaison de système et d'architecture supportée.
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: [quality, security-source, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            extension: ""
          - os: linux
            arch: arm64
            extension: ""
          - os: darwin
            arch: amd64
            extension: ""
          - os: darwin
            arch: arm64
            extension: ""
          - os: windows
            arch: amd64
            extension: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build reproducible binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="dev"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/flotio-dev/cli/cmd.version=$version" \
            -o "dist/flotio-${GOOS}-${GOARCH}${{ matrix.extension }}" .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flotio-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Produit les archives de release, leurs checksums et les publie pour un tag SemVer.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Download exact build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flotio-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum flotio-* > SHA256SUMS

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dist
          format: spdx-json
          output: sbom.spdx.json
          timeout: 15m
          version: v0.74.0

      - name: Attest provenance
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/flotio-*

      - name: Attest SBOM
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/flotio-*
          sbom-path: sbom.spdx.json

      - name: Verify attestations
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/flotio-*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Explain unavailable attestations
        if: github.event.repository.private && vars.ATTESTATIONS_ENABLED != 'true'
        run: echo "::notice::Artifact attestations are disabled for private repositories. Set ATTESTATIONS_ENABLED=true when GitHub Enterprise Cloud is available."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom.spdx.json --verify-tag --generate-notes

  # Agrège les résultats obligatoires en un check stable utilisable par la protection de branche.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [quality, security-source, codeql, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY_SOURCE: ${{ needs.security-source.result }}
          CODEQL: ${{ needs.codeql.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          test "$QUALITY" = success
          test "$SECURITY_SOURCE" = success
          test "$CODEQL" = success
          test "$BUILD" = success
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE" = success
          fi
