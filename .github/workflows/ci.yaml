name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Calcule la version sémantique appropriée pour le build et la release.
  version:
    name: Compute Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      is_release: ${{ steps.compute.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force || true

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            latest_tag="$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed 's/^v//' | sort -V | tail -n 1 || true)"
            
            if [ -z "$latest_tag" ]; then
              major=0
              minor=1
              patch=0
              prev_ref=""
            else
              IFS='.' read -r major minor patch <<< "$latest_tag"
              major="${major:-0}"
              minor="${minor:-0}"
              patch="${patch:-0}"
              if git rev-parse "v$latest_tag" >/dev/null 2>&1; then
                prev_ref="v$latest_tag"
              elif git rev-parse "$latest_tag" >/dev/null 2>&1; then
                prev_ref="$latest_tag"
              else
                prev_ref=""
              fi
            fi

            if [ -n "$prev_ref" ]; then
              commits="$(git log "$prev_ref..HEAD" --pretty=format:"%s %b" || true)"
            else
              commits="$(git log -n 20 --pretty=format:"%s %b" || true)"
            fi

            if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
              major=$((major + 1))
              minor=0
              patch=0
            elif echo "$commits" | grep -qiE "^(feat)(\(.*\))?:"; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            tag="v$major.$minor.$patch"
            version="$major.$minor.$patch"
            echo "Calculated release: tag=$tag, version=$version"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=dev" >> "$GITHUB_OUTPUT"
          echo "version=dev" >> "$GITHUB_OUTPUT"
          echo "is_release=false" >> "$GITHUB_OUTPUT"

  # Vérifie le formatage, les modules, go vet et les tests Go avec le détecteur de data races.
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  # Contrôle les dépendances si disponible puis bloque les vulnérabilités et secrets avec Trivy.
  security-source:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          timeout: 15m
          version: v0.74.0

  # Analyse statiquement le code Go avec CodeQL lorsque GitHub Code Security est disponible.
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        run: go build ./...

      - name: Analyze
        if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:go

      - name: Explain unavailable CodeQL
        if: github.event.repository.private && vars.CODEQL_ENABLED != 'true'
        run: echo "::notice::Enable GitHub Code Security, then set CODEQL_ENABLED=true to enforce CodeQL."

  # Compile et contrôle le binaire pour chaque combinaison de système et d'architecture supportée.
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: [version, quality, security-source, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            extension: ""
          - os: linux
            arch: arm64
            extension: ""
          - os: darwin
            arch: amd64
            extension: ""
          - os: darwin
            arch: arm64
            extension: ""
          - os: windows
            arch: amd64
            extension: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build reproducible binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/flotio-dev/cli/cmd.version=$VERSION" \
            -o "dist/flotio-${GOOS}-${GOARCH}${{ matrix.extension }}" .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flotio-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Produit les archives de release, leurs checksums et les publie pour un tag SemVer ou lors d'un push sur main.
  release:
    name: Release & Tag
    if: needs.version.outputs.is_release == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flotio-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum flotio-* > SHA256SUMS

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dist
          format: spdx-json
          output: sbom.spdx.json
          timeout: 15m
          version: v0.74.0

      - name: Attest provenance
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/flotio-*

      - name: Attest SBOM
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/flotio-*
          sbom-path: sbom.spdx.json

      - name: Verify attestations
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/flotio-*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Explain unavailable attestations
        if: github.event.repository.private && vars.ATTESTATIONS_ENABLED != 'true'
        run: echo "::notice::Artifact attestations are disabled for private repositories. Set ATTESTATIONS_ENABLED=true when GitHub Enterprise Cloud is available."

      - name: Create GitHub release and Git Tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* sbom.spdx.json \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  # Agrège les résultats obligatoires en un check stable utilisable par la protection de branche.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [version, quality, security-source, codeql, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY_SOURCE: ${{ needs.security-source.result }}
          CODEQL: ${{ needs.codeql.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ needs.release.result }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          set -euo pipefail
          test "$QUALITY" = success
          test "$SECURITY_SOURCE" = success
          test "$CODEQL" = success
          test "$BUILD" = success
          if [ "$IS_RELEASE" = "true" ]; then
            test "$RELEASE" = success
          fi
